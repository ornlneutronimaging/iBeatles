[project]
name = "ibeatles"
description = "Bragg edge strain mapping"
readme = "README.md"
authors = [
  {name = "Jean Bilheux", email = "bilheuxjm@ornl.gov"},
  {name = "Chen Zhang", email = "zhangc@ornl.gov"},
]
maintainers = [
  { name = "Jean Bilheux", email = "bilheuxjm@ornl.gov"},
  { name = "Chen Zhang", email="zhangc@ornl.gov"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research"
]
dynamic = ["version"]
# SPEC 0 floor (org policy 2026-06-10). The <3.13 cap is real, not stale:
# the PyQt5/qt-main 5.15 conda chain has no coherent 3.13/3.14 build set for
# this dependency tree (verified 2026-06-12) — revisit on Qt6 or newer
# conda-forge builds
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
keywords = ["Bragg Edge", "neutron", "imaging", "strain mapping"]
dependencies = [
  # These are the absolute minimum dependencies needed by the project
  "numpy",
  "matplotlib",
  "h5py",
  "Pillow",
  "astropy",
  "scipy",
  "lmfit",
  "loguru",
  "tqdm",
  "tomli",
  "pydantic",
  # GUI
  "QtPy",
  "PyQt5",
  "pyqtgraph",
  # These are the dependencies from our neutron imaging team
  "neutronbraggedge>=2.0.6,<3",
  "changepy>=0.4.0,<0.5",
  "neunorm>=1.6.12,<2",
]

[project.urls]
homepage = "https://github.com/ornlneutronimaging/iBeatles"
"Bug Tracker" = "https://github.com/ornlneutronimaging/iBeatles/issues"
# "Documentation" = "https://ibeatles.readthedocs.io/"
"Source Code" = "https://github.com/ornlneutronimaging/iBeatles"

[project.scripts]
ibeatles = "ibeatles.__main__:main"

[build-system]
requires = [
  "setuptools >= 40.6.0",
  "wheel",
  "toml",
  "versioningit"
]
build-backend = "setuptools.build_meta"

[tool.versioningit.vcs]
method = "git"
default-tag = "1.0.0"

[tool.versioningit.next-version]
method = "minor"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}"
dirty = "{version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+d{build_date:%Y%m%d%H%M}"

[tool.versioningit.write]
file = "src/ibeatles/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.setuptools.package-data]
"*" = ["*.yml","*.yaml","*.ini","**/*.ui","**/*.json", "**/icons/*"]

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = [".git", "tmp*", "_tmp*", "__pycache__", "*dataset*", "*data_set*"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: tests that are slow to run",
    "gui: tests for the GUI components"
]

[tool.pylint]
max-line-length = 120
disable = [
  "too-many-locals",
  "too-many-statements",
  "too-many-instance-attributes",
  "too-many-arguments",
  "duplicate-code"
]

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge", "neutronimaging"]
platforms = ["osx-arm64", "linux-64"]
conda-pypi-map = { "conda-forge" = "pixi-mapping.json" }

[tool.pixi.pypi-dependencies]
ibeatles = { path = ".", editable = true }

[tool.pixi.dependencies]
numpy = "*"
matplotlib = "*"
h5py = "*"
Pillow = "*"
astropy = "*"
scipy = "*"
lmfit = "*"
loguru = "*"
tqdm = "*"
tomli = "*"
pydantic = "*"
pyqtgraph = "*"
qt = "*"
qtpy = "*"
pyqt = "*"
pandas = ">=2.3.3,<3"
openssl = ">=3.6.3"   # CVE-2026-34182 (critical) + 8 high fixed in 3.6.3
h11 = ">=0.16"        # GHSA-vqfr-h8mv-ghfj (critical, request smuggling) fixed in 0.16
sqlite = ">=3.53.2"   # CVE-2026-11822, CVE-2026-11824 (newest conda-forge build)

[tool.pixi.tasks]
# phony
clean = {depends-on = ["rm_pypi_build", "rm_conda_build", "rm_test"]}
# unit test
test = "pytest tests --cov-branch --cov=src/ibeatles --cov-report=term --cov-report=xml"
rm_test = "rm -rf .coverage .pytest_cache coverage.xml"
# PYPI packaging
build = "python -m build"
rm_pypi_build = "rm -rf dist/ src/ibeatles.egg-info/"
# conda packaging
build-conda = "cd conda.recipe && VERSION=$(versioningit ../) conda mambabuild --channel conda-forge --channel neutronimaging --output-folder . ."  # noqa
rm_conda_build = "rm -rf conda.recipe/channeldata.json conda.recipe/index.html conda.recipe/noarch conda.recipe/osx-arm64"
# app
start = "python -m ibeatles"
cli = "python -m ibeatles --no-gui"

[tool.pixi.feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-repeat = "*"

[tool.pixi.feature.package]
# packaging happens on Linux CI; boa's caps also pin old Pythons, so this
# feature lives in its own solve-group (see [tool.pixi.environments])
platforms = ["linux-64"]

[tool.pixi.feature.package.dependencies]
versioningit = "*"
boa = "*"
conda-build = "*"
python-build = "*"
twine = ">=6.1.0,<7"
anaconda-client = ">=1.13.0,<2"

[tool.pixi.feature.developer.dependencies]
pip = "*"
versioningit = "*"
pre-commit = "*"
conda-tree = "*"
ruff = "*"

[tool.pixi.feature.jupyter.dependencies]
jupyterlab = ">=4.5.1,<5"
ipykernel = ">=7.1.0,<8"
ipympl = "*"
ipywidgets = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
# package isolated in its own solve-group: boa/conda-build caps would hold
# the whole default env (tests included) at an old Python; packaging tasks
# run via `pixi run -e package ...`
default = { features = ["test", "developer", "marimo"], solve-group = "default" }
package = { features = ["package"], solve-group = "package" }
jupyter = { features = ["jupyter"], solve-group = "jupyter" }
# per-version test environment for the CI matrix. SPEC 0 targets 3.12-3.14,
# but 3.13/3.14 are unsolvable on linux-64 (PyQt5/qt-main 5.15 chain) — the
# requires-python cap documents this; revisit on Qt6 or newer conda-forge
# builds
py312 = { features = ["test", "py312"], solve-group = "py312" }

# ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["notebooks/**", "**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ibeatles"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
marimo = ["marimo[recommended]"]
jupyter = ["jupyterlab", "ipympl", "ipywidgets"]
