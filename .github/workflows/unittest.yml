name: unit-test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
    tags:
      - "v*"

permissions:
  contents: read

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # real per-version pixi environments (SPEC 0 window); the default
        # env was previously held back by the packaging stack's caps
        environment: [py312]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: pyproject.toml
          environments: ${{ matrix.environment }}
      - name: run unit tests
        run: |
          echo "running unit tests"
          pixi run -e ${{ matrix.environment }} pytest tests --cov-branch --cov=src/ibeatles --cov-report=term --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'py312'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ornlneutronimaging/iBeatles

  # grype scans the installed pixi env (pip + conda packages), gates only on
  # fixable findings, and uploads SARIF to the Security tab (org decision
  # 2026-06-10: grype, not pip-audit)
  dependency-scan:
    name: Scan dependencies with Grype
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required for upload-sarif
      actions: read # upload-sarif on private repos
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          manifest-path: pyproject.toml
          environments: default
      - name: Scan pixi environment with Grype
        uses: neutrons/conda-actions/grype@bba9ca89d48d9ae846db9650cc63fde736340b3d # v2
        with:
          path: ${{ github.workspace }}/.pixi/envs/default
          # only-fixed defaults to true in the v2 wrapper, so unfixable
          # advisories never fail the build
          fail-build: false
