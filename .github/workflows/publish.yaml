name: packaging and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
    tags:
      - "v*"

permissions:
  contents: read

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      # job-level permissions replace the workflow block; contents:read is
      # what checkout needs, id-token:write is for PyPI trusted publishing
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          environments: package
      - name: build conda package
        run: |
          echo "Build conda package"
          pixi run -e package build-conda
      - name: upload conda package to anaconda
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          IS_RC: ${{ contains(github.ref, 'rc') }}
        run: |
          # label is main or rc depending on the tag-name
          CONDA_LABEL="main"
          if [ "${IS_RC}" = "true" ]; then CONDA_LABEL="rc"; fi
          echo pushing ${{ github.ref }} with label $CONDA_LABEL
          pixi run -e package anaconda upload --label $CONDA_LABEL --user neutronimaging conda.recipe/noarch/ibeatles*.tar.bz2
      - name: build PyPI package
        run: |
          echo "Build and publish PyPI package"
          pixi run -e package build
      - name: upload conda artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: conda.recipe/noarch/ibeatles*.tar.bz2
      - name: upload PyPI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: pypi-package
          path: dist/*
      - name: publish PyPI package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
  # Create GitHub Release with auto-generated release notes
  github-release:
    name: Create GitHub Release
    needs: linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download conda artifact
        uses: actions/download-artifact@v4
        with:
          name: conda-package
          path: dist/conda

      - name: Download PyPI artifact
        uses: actions/download-artifact@v4
        with:
          name: pypi-package
          path: dist/pypi

      - name: List artifacts
        run: |
          echo "Conda packages:"
          ls -la dist/conda/
          echo "PyPI packages:"
          ls -la dist/pypi/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/conda/*
            dist/pypi/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
