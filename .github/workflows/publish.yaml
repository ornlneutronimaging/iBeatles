name: packaging and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - qa
      - next
    tags:
      - "v*"

permissions:
  contents: read

# cancel previous job if new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    # Build + PR smoke-test job. Runs on every trigger, including fork PRs,
    # so it must NOT hold id-token:write — see the dedicated pypi-publish job
    # below for trusted publishing (it only runs on tags).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          environments: package
      - name: build conda package
        run: |
          echo "Build conda package"
          pixi run -e package build-conda
      - name: upload conda package to anaconda
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
          IS_RC: ${{ contains(github.ref, 'rc') }}
        run: |
          # label is main or rc depending on the tag-name
          CONDA_LABEL="main"
          if [ "${IS_RC}" = "true" ]; then CONDA_LABEL="rc"; fi
          echo pushing ${{ github.ref }} with label $CONDA_LABEL
          pixi run -e package anaconda upload --label $CONDA_LABEL --user neutronimaging conda.recipe/noarch/ibeatles*.tar.bz2
      - name: build PyPI package
        run: |
          echo "Build and publish PyPI package"
          pixi run -e package build
      - name: upload conda artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: conda-package
          path: conda.recipe/noarch/ibeatles*.tar.bz2
      - name: upload PyPI artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: pypi-package
          path: dist/*

  # Trusted publishing to PyPI. Isolated in its own tag-only job so that
  # id-token:write is never present while fork-PR-controlled build code runs.
  pypi-publish:
    name: Publish to PyPI (trusted publishing)
    needs: linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyPI artifact
        uses: actions/download-artifact@v8
        with:
          name: pypi-package
          path: dist
      - name: publish PyPI package
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  # Create GitHub Release with auto-generated release notes
  github-release:
    name: Create GitHub Release
    needs: linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download conda artifact
        uses: actions/download-artifact@v8
        with:
          name: conda-package
          path: dist/conda

      - name: Download PyPI artifact
        uses: actions/download-artifact@v8
        with:
          name: pypi-package
          path: dist/pypi

      - name: List artifacts
        run: |
          echo "Conda packages:"
          ls -la dist/conda/
          echo "PyPI packages:"
          ls -la dist/pypi/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/conda/*
            dist/pypi/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
