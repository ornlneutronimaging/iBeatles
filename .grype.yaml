  - vulnerability: CVE-2026-12003
    package:
      name: python

  # Qt 5.15 open-source receives no upstream fixes (patches land in Qt 6
  # only), so every qt 5.15.x advisory counts as "fixable" while no fix is
  # installable for a PyQt5 application. The qt 5.15 build also pins
  # gstreamer to the 1.26 line, so the gstreamer fixes shipped in 1.28 are
  # equally uninstallable here. Revisit both when the GUI migrates to
  # Qt 6 / PyQt6.
  - package:
      name: qt
  - package:
      name: gstreamer

  # sqlite 3.53.2 is the newest conda-forge build today (2026-06-12); if
  # these advisories are fixed only in a newer upstream sqlite, no packaged
  # fix is installable yet (entries are inert if 3.53.2 already fixed them).
  # Remove when conda-forge ships newer sqlite.
  - vulnerability: CVE-2026-11822
    package:
      name: sqlite
  - vulnerability: CVE-2026-11824
    package:
      name: sqlite

  # pyo3 0.28.3 is statically linked into the rpds-py wheel (transitive:
  # jupyter/jsonschema -> referencing -> rpds-py). grype catalogs it from the
  # compiled binary, but it is not fixable from this repo — it needs an upstream
  # conda-forge rebuild of rpds-py against pyo3 >= 0.29.0 (the first patched
  # version). Remove both once that lands (the lockfile-update workflow will pick
  # it up). The same advisories were fixed directly in the group's own Rust repos
  # (NEREIDS/bm3dornl).
  - vulnerability: GHSA-36hh-v3qg-5jq4 # HIGH: pyo3 OOB read in nth/nth_back for PyList/PyTuple
    package:
      name: pyo3
  - vulnerability: GHSA-chgr-c6px-7xpp # MEDIUM: pyo3 missing Sync bound on PyCFunction::new_closure
    package:
      name: pyo3
